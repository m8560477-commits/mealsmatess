name: Emergency restore styles
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/emergency-restore-styles.yaml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download good styles.css
        run: |
          curl -fsSL "https://raw.githubusercontent.com/m8560477-commits/mealsmatess/567a69f481389e5e9e67139484aed23b95ed832b/src/styles.css" -o src/styles.css
          wc -c src/styles.css
          head -3 src/styles.css
          grep -q tailwindcss src/styles.css
          python3 -c "from pathlib import Path; p=Path('src/styles.css'); t=p.read_text();
import sys
if 'styles-auth-override' not in t:
 t=t.replace('@import \"./styles-paywall-override.css\";', '@import \"./styles-paywall-override.css\";\n@import \"./styles-auth-override.css\";', 1); p.write_text(t)
print(p.stat().st_size)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/styles.css
          git status
          git commit -m "Restore styles.css from known good commit" || echo nothing
          git push
